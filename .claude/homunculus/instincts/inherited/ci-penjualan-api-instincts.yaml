# Ci Penjualan Api Workflow Add Background Job With Queue

## Action

Follow the add-background-job-with-queue workflow:
1. Create a new Job class in app/Jobs (e.g., ExportJob.php, SendEmailJob.php)
2. Register the job in app/Config/Queue.php
3. Update relevant Controller to dispatch the job instead of running logic synchronously
4. Update or create related Service or Library classes if needed
5. Update composer.json/lock if new packages are required

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: app/Jobs/*.php, app/Config/Queue.php, app/Controllers/Api/*.php

