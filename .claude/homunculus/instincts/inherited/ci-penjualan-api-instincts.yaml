# Ci Penjualan Api Workflow Add Notification Feature

## Action

Follow the add-notification-feature workflow:
1. Create or update Notification model, service, and controller (app/Models/Notification.php, app/Services/NotificationService.php, app/Controllers/Api/NotificationController.php)
2. Add or update database migration for notifications (app/Database/Migrations/*CreateNotificationsTable.php)
3. Update routes in app/Config/Routes.php
4. Update job or service to emit notification (e.g., ExportJob.php, NotificationService.php)
5. Implement secure file serving and ownership checks if needed

## Evidence

